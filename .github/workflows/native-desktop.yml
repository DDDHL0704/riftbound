name: Backend L3 nightly

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Shanghai; one fixed main snapshot per night
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  scope:
    name: Fix nightly main SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.fixed.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 2
      - name: Freeze main once for every L3 job
        id: fixed
        run: |
          python3 - <<'PYFIX'
          import os, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + commit + '\n')
          subprocess.run(['python3', 'scripts/ci-candidate.py', '--expected', commit,
                          '--output', 'var/qa/ci-scope/checkout.json'], check=True)
          PYFIX
      - name: Verification safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-scope
          path: var/qa/ci-scope/
          retention-days: 90

  rule_prepare:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sdk: ${{ steps.plan.outputs.sdk }}
    env:
      RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - name: Verify fixed nightly build checkout
        run: python3 scripts/ci-candidate.py --expected "$RIFTBOUND_FIXED_COMMIT" --event-sha "$RIFTBOUND_FIXED_COMMIT" --output var/qa/nightly-prepared/checkout.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.403
      - name: Test runner coverage safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prove exact Linux row selection
        run: python3 scripts/probe-l2-row-selection.py --commit "$RIFTBOUND_FIXED_COMMIT" --output var/qa/nightly-prepared/row-filter-probe
      - name: Build once and enumerate every full rule case
        id: plan
        run: python3 scripts/l2-distributed.py prepare --profile full --commit "$RIFTBOUND_FIXED_COMMIT" --shards 8 --output var/qa/nightly-prepared --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-rule-plan
          path: |
            var/qa/nightly-prepared/*.json
            var/qa/nightly-prepared/*.log
            var/qa/nightly-prepared/source-scope/source-guard-methods.json
            var/qa/nightly-prepared/row-filter-probe/receipt.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-rule-built-input
          path: var/qa/nightly-prepared/bundle.tar.gz
          compression-level: 0
          retention-days: 14

  rule_shards:
    needs: [scope, rule_prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Eight smaller jobs leave headroom below the six-hour limit; keep
        # at most six running while other nightly acceptances use the pool.
        shard: [shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7, shard-8]
    concurrency:
      group: rule-suite-${{ github.ref }}-${{ needs.scope.outputs.commit }}-${{ matrix.shard }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            ${{ needs.rule_prepare.outputs.sdk }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nightly-rule-plan
          path: var/qa/nightly-prepared
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nightly-rule-built-input
          path: var/qa/nightly-prepared
      - name: Verify fixed nightly shard checkout
        run: python3 scripts/ci-candidate.py --expected "$RIFTBOUND_FIXED_COMMIT" --event-sha "$RIFTBOUND_FIXED_COMMIT" --output var/qa/nightly-shards/${{ matrix.shard }}/checkout.json
      - name: Execute every assigned full rule case without rebuilding
        run: python3 scripts/l2-distributed.py shard --commit "$RIFTBOUND_FIXED_COMMIT" --prepared var/qa/nightly-prepared --shard '${{ matrix.shard }}' --output var/qa/nightly-shards/${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: nightly-rule-${{ matrix.shard }}
          path: var/qa/nightly-shards/${{ matrix.shard }}/
          retention-days: 90

  rule_suite:
    needs: [scope, rule_prepare, rule_shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nightly-rule-plan
          path: var/qa/nightly-prepared
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: nightly-rule-shard-*
          path: var/qa/nightly-shards
      - name: Restore original shard names
        run: |
          python3 -c "from pathlib import Path; p=Path('var/qa/nightly-shards'); [(x.rename(p/x.name.removeprefix('nightly-rule-'))) for x in list(p.iterdir()) if x.is_dir() and x.name.startswith('nightly-rule-shard-')]"
      - name: Verify fixed nightly aggregate checkout
        run: python3 scripts/ci-candidate.py --expected "$RIFTBOUND_FIXED_COMMIT" --output var/qa/ci-rules/checkout.json
      - name: Require every discovered full rule case exactly once
        env:
          RIFTBOUND_PREPARE: ${{ needs.rule_prepare.result }}
          RIFTBOUND_RULE_SHARDS: ${{ needs.rule_shards.result }}
        run: python3 scripts/l2-distributed.py aggregate-full --commit "$RIFTBOUND_FIXED_COMMIT" --prepared var/qa/nightly-prepared --inputs var/qa/nightly-shards --output var/qa/ci-rules/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: conformance-results
          path: var/qa/ci-rules/
          retention-days: 90

  postgres_partitions:
    needs: scope
    # All nightly jobs use the one main SHA selected by scope.
    if: ${{ needs.scope.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Each independent full job has its own six-hour budget. Run the rule
    # suite and real SQL/network in the first wave; never remove test inputs.
    timeout-minutes: 360
    concurrency:
      group: postgres-${{ github.ref }}-${{ needs.scope.outputs.commit }}-${{ matrix.partition }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - name: Verify fixed nightly checkout
        run: python3 scripts/ci-candidate.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/nightly-checkout.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record the fixed PostgreSQL and network commit
        run: |
          mkdir -p var/qa
          git rev-parse HEAD > var/qa/ci-postgres-partition-commit.txt
      - name: Real PostgreSQL complete checked partition
        env:
          RIFTBOUND_POSTGRES_EVIDENCE: var/qa/ci-postgres
        run: dotnet run --project tests/Riftbound.PostgresAcceptance -- --ci-partition ${{ matrix.partition }} 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: postgres-partition-${{ matrix.partition }}
          path: |
            var/qa/ci-postgres/
            var/qa/ci-postgres-partition-commit.txt
          retention-days: 90

  native_network:
    needs: scope
    if: ${{ needs.scope.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: native-network-${{ github.ref }}-${{ needs.scope.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - name: Verify fixed nightly checkout
        run: python3 scripts/ci-candidate.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/nightly-checkout.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record the fixed native network commit
        run: |
          mkdir -p var/qa/ci-native-network
          git rev-parse HEAD > var/qa/ci-native-network/commit.txt
      - name: Native client connection recovery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:15089
          ConnectionStrings__Riftbound: ''
          RIFTBOUND_SERVER_URL: http://127.0.0.1:15089
        run: |
          dotnet build src/Riftbound.Api
          dotnet run --project src/Riftbound.Api --no-build --no-launch-profile > var/qa/ci-native-network/native-api.log 2>&1 &
          riftbound_api_pid=$!
          trap 'kill "$riftbound_api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$RIFTBOUND_SERVER_URL/health"; then break; fi
            sleep 1
          done
          dotnet run --project tests/Riftbound.NativeNetworkSmoke > var/qa/ci-native-network/native-network.log 2>&1
          cat var/qa/ci-native-network/native-network.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-network-results
          path: var/qa/ci-native-network/
          retention-days: 90

  postgres:
    needs: [scope, postgres_partitions, native_network, related_network]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: postgres-gate-${{ github.ref }}-${{ needs.scope.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - name: Verify fixed nightly checkout
        run: python3 scripts/ci-candidate.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/nightly-checkout.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: postgres-partition-*
          merge-multiple: false
          path: var/qa/ci-sql-inputs
      - name: Require every fixed SQL case, SignalR and process restart result
        env:
          RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
          RIFTBOUND_SCOPE_RESULT: ${{ needs.scope.result }}
          RIFTBOUND_POSTGRES_PARTITIONS_RESULT: ${{ needs.postgres_partitions.result }}
          RIFTBOUND_NATIVE_NETWORK_RESULT: ${{ needs.native_network.result }}
          RIFTBOUND_RELATED_NETWORK_RESULT: ${{ needs.related_network.result }}
        run: >-
          python3 scripts/sql-ci-gate.py --commit "$RIFTBOUND_FIXED_COMMIT"
          --manifest tests/Riftbound.PostgresAcceptance/SqlAcceptanceCases.json
          --inputs var/qa/ci-sql-inputs --scope "$RIFTBOUND_SCOPE_RESULT"
          --postgres-partitions "$RIFTBOUND_POSTGRES_PARTITIONS_RESULT"
          --native-network "$RIFTBOUND_NATIVE_NETWORK_RESULT"
          --related-network "$RIFTBOUND_RELATED_NETWORK_RESULT"
          --output var/qa/ci-sql-gate/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: postgres-results
          path: var/qa/ci-sql-gate/
          retention-days: 90

  rules:
    needs: [scope, rule_suite, postgres]
    # Keep the existing required check. Failed/cancelled/skipped full children
    # must reach this gate and fail; a skipped child must never appear green.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rules-${{ github.ref }}-${{ needs.scope.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - name: Verify fixed nightly checkout
        run: python3 scripts/ci-candidate.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/nightly-checkout.json
      - name: Require every fixed full child job
        env:
          RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
          RIFTBOUND_SCOPE_RESULT: ${{ needs.scope.result }}
          RIFTBOUND_RULE_SUITE_RESULT: ${{ needs.rule_suite.result }}
          RIFTBOUND_POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: >-
          python3 scripts/full-ci-gate.py --commit "$RIFTBOUND_FIXED_COMMIT"
          --scope "$RIFTBOUND_SCOPE_RESULT" --rule-suite "$RIFTBOUND_RULE_SUITE_RESULT"
          --postgres "$RIFTBOUND_POSTGRES_RESULT" --output var/qa/ci-full-gate/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: full-verification-gate
          path: var/qa/ci-full-gate/
          retention-days: 90

  related_network:
    name: SQL SignalR process restart
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIFTBOUND_FIXED_COMMIT: ${{ needs.scope.outputs.commit }}
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
      PGPASSWORD: riftbound_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Real PostgreSQL and two-player SignalR with actual API process restart
        run: python3 scripts/run-process-restart-ci.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/ci-process-restart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: process-restart-results
          path: var/qa/ci-process-restart/
          retention-days: 90
      - name: Declared payment SQL and authenticated reconnect stages
        if: ${{ !cancelled() }}
        run: python3 scripts/run-payment-reconnect-ci.py --expected "${{ needs.scope.outputs.commit }}" --output var/qa/ci-payment-reconnect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: payment-reconnect-results
          path: var/qa/ci-payment-reconnect/
          retention-days: 90

  desktop:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.scope.outputs.commit }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: python3 clients/godot/tools/ci-desktop.py
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            clients/godot/exports/ci-logs/
            clients/godot/exports/macos/Riftbound.zip
            clients/godot/exports/windows/Riftbound-windows-x64.zip
          retention-days: 90
          compression-level: 0
