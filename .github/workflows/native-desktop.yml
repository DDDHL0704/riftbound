name: Native desktop and China rules

on:
  push:
    branches: [main, 'codex/native-platform-*']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable candidate commit; must match the dispatched ref
        required: false
        type: string
  schedule:
    - cron: '0 18 * * 1-6' # 02:00 Asia/Shanghai, daily full
    - cron: '0 18 * * 0'   # weekly L3, longer artifact retention

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  RIFTBOUND_EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      tier: ${{ steps.select.outputs.tier }}
      sql: ${{ steps.select.outputs.sql }}
      network: ${{ steps.select.outputs.network }}
      packaging: ${{ steps.select.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - name: Verification safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Determine scope from fixed Git inputs
        id: select
        run: >-
          python3 scripts/ci-change-scope.py
          --event "$GITHUB_EVENT_PATH" --head "$GITHUB_SHA"
          --output var/qa/ci-scope/decision.json --github-output "$GITHUB_OUTPUT"
      - name: Make retained audit commit available without rewriting evidence
        run: |
          python3 - <<'PYBASELINE'
          import json, re, subprocess
          from pathlib import Path
          path = Path('docs/audit/legacy-source-baseline.json')
          if path.exists():
              commit = json.loads(path.read_text())['commit']
              assert re.fullmatch(r'[0-9a-f]{40}', commit)
              if subprocess.run(['git', 'cat-file', '-e', commit+'^{commit}'], stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', commit], check=True, timeout=120)
          PYBASELINE
      - name: Source-index and governance integrity
        run: python3 scripts/audit/check-project-governance.py --output var/qa/ci-scope/governance.json
      - name: Check committed diff formatting
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          decision = json.loads(Path('var/qa/ci-scope/decision.json').read_text())
          base, head = decision['baseSha'], decision['headSha']
          available = base and subprocess.run(['git', 'cat-file', '-e', base+'^{commit}'],
                                              stderr=subprocess.DEVNULL).returncode == 0
          command = ['git', 'diff', '--check', base, head] if available else ['git', 'show', '--format=', '--check', head]
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-scope
          path: var/qa/ci-scope/
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 30 }}

  scoped_rules:
    needs: scope
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs.tier == 'L1' || needs.scope.outputs.tier == 'L2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-scope
          path: var/qa/fixed-scope
      - name: Reproduce Git scope and execute focused or integration checks
        run: python3 scripts/run-scoped-ci.py --decision var/qa/fixed-scope/decision.json --output var/qa/ci-scoped
      - name: State bounded execution
        if: always()
        run: echo 'Scoped backend verification. Complete rule matrix was NOT executed; SQL/network jobs retain their own required outcomes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: scoped-conformance-results
          path: var/qa/ci-scoped/
          retention-days: 7

  rule_suite:
    needs: scope
    # A failed or missing selector still executes the complete fixed inputs.
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    # Each independent full job has its own six-hour budget. Run the rule
    # suite and real SQL/network in the first wave; never remove test inputs.
    timeout-minutes: 360
    concurrency:
      group: rule-suite-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test runner coverage safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Record the fixed rule suite commit
        run: |
          mkdir -p var/qa
          git rev-parse HEAD > var/qa/ci-rule-suite-commit.txt
      - name: Complete rule suite with checked process shards
        run: python3 scripts/test-rules.py full --output var/qa/ci-rules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-results
          path: |
            var/qa/ci-rules/
            var/qa/ci-rule-suite-commit.txt
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}

  postgres_partitions:
    needs: scope
    # A failed or missing selector still executes the complete fixed inputs.
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.sql != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Each independent full job has its own six-hour budget. Run the rule
    # suite and real SQL/network in the first wave; never remove test inputs.
    timeout-minutes: 360
    concurrency:
      group: postgres-${{ github.ref }}-${{ github.sha }}-${{ matrix.partition }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record the fixed PostgreSQL and network commit
        run: |
          mkdir -p var/qa
          git rev-parse HEAD > var/qa/ci-postgres-partition-commit.txt
      - name: Real PostgreSQL complete checked partition
        env:
          RIFTBOUND_POSTGRES_EVIDENCE: var/qa/ci-postgres
        run: dotnet run --project tests/Riftbound.PostgresAcceptance -- --ci-partition ${{ matrix.partition }} 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: postgres-partition-${{ matrix.partition }}
          path: |
            var/qa/ci-postgres/
            var/qa/ci-postgres-partition-commit.txt
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}

  native_network:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.network != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: native-network-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record the fixed native network commit
        run: |
          mkdir -p var/qa/ci-native-network
          git rev-parse HEAD > var/qa/ci-native-network/commit.txt
      - name: Native client connection recovery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:15089
          ConnectionStrings__Riftbound: ''
          RIFTBOUND_SERVER_URL: http://127.0.0.1:15089
        run: |
          dotnet build src/Riftbound.Api
          dotnet run --project src/Riftbound.Api --no-build --no-launch-profile > var/qa/ci-native-network/native-api.log 2>&1 &
          riftbound_api_pid=$!
          trap 'kill "$riftbound_api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$RIFTBOUND_SERVER_URL/health"; then break; fi
            sleep 1
          done
          dotnet run --project tests/Riftbound.NativeNetworkSmoke > var/qa/ci-native-network/native-network.log 2>&1
          cat var/qa/ci-native-network/native-network.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-network-results
          path: var/qa/ci-native-network/
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}

  related_network:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.network != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: related-network-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16.13@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: riftbound_ci
          POSTGRES_DB: riftbound_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riftbound_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__Riftbound: Host=127.0.0.1;Port=5432;Database=riftbound_acceptance;Username=postgres;Password=riftbound_ci;SSL Mode=Disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-related-network
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Fixed PostgreSQL API process restart and original journal gates
        run: >-
          python3 scripts/run-related-network-ci.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --output var/qa/ci-related-network
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: related-network-results
          path: var/qa/ci-related-network/
          retention-days: 90

  postgres:
    needs: [scope, postgres_partitions, native_network, related_network]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.sql != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: postgres-gate-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: postgres-partition-*
          merge-multiple: false
          path: var/qa/ci-sql-inputs
      - name: Require every fixed SQL case and native network result
        env:
          RIFTBOUND_SCOPE_RESULT: ${{ needs.scope.result }}
          RIFTBOUND_POSTGRES_PARTITIONS_RESULT: ${{ needs.postgres_partitions.result }}
          RIFTBOUND_NATIVE_NETWORK_RESULT: ${{ needs.native_network.result }}
          RIFTBOUND_RELATED_NETWORK_RESULT: ${{ needs.related_network.result }}
        run: >-
          python3 scripts/sql-ci-gate.py --commit "$GITHUB_SHA"
          --manifest tests/Riftbound.PostgresAcceptance/SqlAcceptanceCases.json
          --inputs var/qa/ci-sql-inputs --scope "$RIFTBOUND_SCOPE_RESULT"
          --postgres-partitions "$RIFTBOUND_POSTGRES_PARTITIONS_RESULT"
          --native-network "$RIFTBOUND_NATIVE_NETWORK_RESULT"
          --related-network "$RIFTBOUND_RELATED_NETWORK_RESULT"
          --output var/qa/ci-sql-gate/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: postgres-results
          path: var/qa/ci-sql-gate/
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}

  rules:
    needs: [scope, rule_suite, postgres]
    # Keep the existing required check. Failed/cancelled/skipped full children
    # must reach this gate and fail; a skipped child must never appear green.
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: rules-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - name: Require every fixed full child job
        env:
          RIFTBOUND_SCOPE_RESULT: ${{ needs.scope.result }}
          RIFTBOUND_RULE_SUITE_RESULT: ${{ needs.rule_suite.result }}
          RIFTBOUND_POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: >-
          python3 scripts/full-ci-gate.py --commit "$GITHUB_SHA"
          --scope "$RIFTBOUND_SCOPE_RESULT" --rule-suite "$RIFTBOUND_RULE_SUITE_RESULT"
          --postgres "$RIFTBOUND_POSTGRES_RESULT" --output var/qa/ci-full-gate/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: full-verification-gate
          path: var/qa/ci-full-gate/
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}

  desktop:
    needs: scope
    # Materialize the matrix even for docs, keeping both existing check names.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # Documentation checks need no native runner or packaging tool downloads.
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.packaging == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    concurrency:
      group: desktop-${{ github.ref }}-${{ github.sha }}-${{ matrix.os }}-${{ needs.scope.result == 'success' && needs.scope.outputs.packaging == 'false' && github.run_id || 'full' }}
      cancel-in-progress: false
    steps:
      - name: Selected scope; packaging not executed
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.packaging == 'false' }}
        run: echo 'Scoped verification. Desktop packaging was not executed. See verification-scope.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false' }}
        with:
          ref: ${{ github.sha }}
      - name: Verify the fixed candidate checkout
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false' }}
        shell: bash
        run: >-
          python3 scripts/ci-candidate.py --expected "$RIFTBOUND_EXPECTED_CANDIDATE_SHA"
          --event-sha "$GITHUB_SHA" --output var/qa/ci-candidate/checkout.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false') }}
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index || 'single' }}
          path: var/qa/ci-candidate/checkout.json
          retention-days: 90
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false' }}
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: python3 clients/godot/tools/ci-desktop.py
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false' }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.packaging != 'false') }}
        with:
          name: native-${{ matrix.os }}
          path: |
            clients/godot/exports/ci-logs/
            clients/godot/exports/macos/Riftbound.zip
            clients/godot/exports/windows/Riftbound-windows-x64.zip
          retention-days: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 18 * * 0') && 90 || 7 }}
          compression-level: 0
