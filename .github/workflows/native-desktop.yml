name: Native desktop and China rules

on:
  push:
    branches: [main, 'codex/native-platform-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Verification safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Determine scope from fixed Git inputs
        id: select
        run: >-
          python3 scripts/ci-change-scope.py
          --event "$GITHUB_EVENT_PATH" --head "$GITHUB_SHA"
          --output var/qa/ci-scope/decision.json --github-output "$GITHUB_OUTPUT"
      - name: Source-index and governance integrity
        run: python3 scripts/audit/check-project-governance.py --output var/qa/ci-scope/governance.json
      - name: Check committed diff formatting
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          decision = json.loads(Path('var/qa/ci-scope/decision.json').read_text())
          base, head = decision['baseSha'], decision['headSha']
          available = base and subprocess.run(['git', 'cat-file', '-e', base+'^{commit}'],
                                              stderr=subprocess.DEVNULL).returncode == 0
          command = ['git', 'diff', '--check', base, head] if available else ['git', 'show', '--format=', '--check', head]
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-scope
          path: var/qa/ci-scope/
          retention-days: 30

  rules:
    needs: scope
    # A failed or missing selector must not silently skip the complete suite.
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: rules-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test runner coverage safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Complete rule suite with checked process shards
        run: python3 scripts/test-rules.py full --output var/qa/ci-rules
      - name: Native client connection recovery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:15089
          ConnectionStrings__Riftbound: ''
          RIFTBOUND_SERVER_URL: http://127.0.0.1:15089
        run: |
          dotnet run --project src/Riftbound.Api --no-build --no-launch-profile > /tmp/riftbound-api.log 2>&1 &
          riftbound_api_pid=$!
          trap 'kill "$riftbound_api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$RIFTBOUND_SERVER_URL/health"; then break; fi
            sleep 1
          done
          dotnet run --project tests/Riftbound.NativeNetworkSmoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-results
          path: var/qa/ci-rules/
          retention-days: 7

  desktop:
    needs: scope
    # Materialize the matrix even for docs, keeping both existing check names.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # Documentation checks need no native runner or packaging tool downloads.
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.full == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    concurrency:
      group: desktop-${{ github.ref }}-${{ github.sha }}-${{ matrix.os }}-${{ needs.scope.result == 'success' && needs.scope.outputs.full == 'false' && github.run_id || 'full' }}
      cancel-in-progress: true
    steps:
      - name: Documentation-only scope; packaging not executed
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.full == 'false' }}
        run: echo 'Documentation-only verification. Desktop packaging was not executed. See verification-scope.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.full != 'false' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.full != 'false' }}
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: python3 clients/godot/tools/ci-desktop.py
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.full != 'false' }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
        with:
          name: native-${{ matrix.os }}
          path: |
            clients/godot/exports/ci-logs/
            clients/godot/exports/macos/Riftbound.zip
            clients/godot/exports/windows/Riftbound-windows-x64.zip
          retention-days: 7
          compression-level: 0
